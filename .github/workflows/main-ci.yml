name: CI - Main

on:
  push:
    branches-ignore:
      - 'skip-ci-*'
      - 'DEFEDIT-*'
      - 'editor-dev'

  repository_dispatch: {}

jobs:
  # ---- BUILD ENGINE VERSIONS ------------------
  bld-eng-darwin:
    strategy:
      matrix:
        platform: [arm64-macos]
    runs-on: macos-14
    timeout-minutes: 30
    steps: [
      {
        name: 'Setup dotnet',
        shell: bash,
        run: 'curl -O https://dot.net/v1/dotnet-install.sh &&
              chmod +x ./dotnet-install.sh &&
              export NUGET_PACKAGES=$(pwd)/tmp/dynamo_home/ext/share/nuget &&
              export DOTNET_ROOT=$(pwd)/tmp/dynamo_home/ext/bin/dotnet &&
              echo "NUGET_PACKAGES=${NUGET_PACKAGES}" >> $GITHUB_ENV &&
              echo "DOTNET_CLI_HOME=${DOTNET_ROOT}" >> $GITHUB_ENV &&
              echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV &&
              mkdir -p ${DOTNET_ROOT} &&
              mkdir -p ${NUGET_PACKAGES} &&
              ./dotnet-install.sh --channel 9.0.1xx --install-dir ${DOTNET_ROOT} &&
              echo ${DOTNET_ROOT} >> $GITHUB_PATH &&
              echo "dotnet version: $(dotnet --version)"'
      },
      {
        name: 'Build engine',
        if: (github.event_name != 'repository_dispatch') || ((github.event_name == 'repository_dispatch') && (github.event.client_payload.skip_engine != true)),
        run: 'ci/ci.sh --platform=${{ matrix.platform }} --archive --skip-builtins --skip-docs engine'
      }]

 